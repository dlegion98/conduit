name: Build & release
# Every branch is built and tested; only main publishes a release (which the apps auto-update to).
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: "build-${{ github.ref }}", cancel-in-progress: false }

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.v.outputs.build }}
      notes: ${{ steps.v.outputs.notes }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # One increasing build number for both apps: the commit count.
      - id: v
        run: |
          echo "build=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
          echo "notes=$(git log -1 --pretty=%s | tr -d '"')" >> "$GITHUB_OUTPUT"

  android:
    needs: version
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android } }
    env:
      BUILD_NUMBER: ${{ needs.version.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      # Same key every build, so updates install over the previous version.
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            # Tolerate spaces/line breaks picked up while pasting the secret.
            printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/conduit.jks" || { echo "::error::ANDROID_KEYSTORE_B64 isn't valid base64 - re-paste it"; exit 1; }
            sum=$(sha256sum "$RUNNER_TEMP/conduit.jks" | cut -d' ' -f1)
            [ "$sum" = "1225994de27ec60b70bb2be02a38598a7eec32e91d12870e839cd08bcfe31010" ] || { echo "::error::ANDROID_KEYSTORE_B64 doesn't match the generated keystore (got ${#KEYSTORE_B64} chars) - re-paste it"; exit 1; }
            echo "CONDUIT_KEYSTORE=$RUNNER_TEMP/conduit.jks" >> "$GITHUB_ENV"
            echo "CONDUIT_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_B64 secret not set; signing with a throwaway debug key (in-app updates will fail)"
          fi
      # Android developer verification: proves to Google that this signing key owns dev.conduit,
      # so Play Protect recognises the app instead of asking for a scan.
      - name: Developer verification snippet
        env:
          ADI_SNIPPET: ${{ secrets.ANDROID_ADI_SNIPPET }}
        run: |
          if [ -n "$ADI_SNIPPET" ]; then
            mkdir -p app/src/main/assets
            printf '%s\n' "$ADI_SNIPPET" > app/src/main/assets/adi-registration.properties
            echo "Included adi-registration.properties"
          fi
      - run: chmod +x gradlew && ./gradlew assembleRelease --stacktrace
      - run: cp app/build/outputs/apk/release/app-release.apk Conduit.apk
      - uses: actions/upload-artifact@v4
        with: { name: android, path: android/Conduit.apk }

  macos:
    needs: version
    runs-on: macos-15
    defaults: { run: { working-directory: macos } }
    env:
      BUILD_NUMBER: ${{ needs.version.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen && xcodegen
      - run: |
          xcodebuild -project Conduit.xcodeproj -scheme Conduit -configuration Release \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION=1.0.$BUILD_NUMBER CURRENT_PROJECT_VERSION=$BUILD_NUMBER build | xcpretty || exit ${PIPESTATUS[0]}
      # Signing, best available first:
      #  1. Developer ID + notarization (no Gatekeeper warning at all) — needs MAC_DEVID_* and ASC_* secrets
      #  2. Stable self-signed identity (keeps macOS permissions across updates)
      #  3. Ad-hoc
      - name: Sign
        env:
          DEVID_P12_B64: ${{ secrets.MAC_DEVID_P12_B64 }}
          DEVID_PASSWORD: ${{ secrets.MAC_DEVID_PASSWORD }}
          CERT_P12_B64: ${{ secrets.MAC_CERT_P12_B64 }}
          CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          APP=build/Build/Products/Release/Conduit.app
          ENT=Conduit/Resources/Conduit-adhoc.entitlements
          KC="$RUNNER_TEMP/sign.keychain-db"
          import_p12() {
            security create-keychain -p ci "$KC"
            security set-keychain-settings "$KC"
            security unlock-keychain -p ci "$KC"
            printf '%s' "$1" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/id.p12"
            security import "$RUNNER_TEMP/id.p12" -k "$KC" -P "$2" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KC" >/dev/null
            security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          }
          if [ -n "$DEVID_P12_B64" ]; then
            import_p12 "$DEVID_P12_B64" "$DEVID_PASSWORD"
            ID=$(security find-identity -v -p codesigning "$KC" | awk -F'"' '/Developer ID Application/{print $2; exit}')
            [ -n "$ID" ] || { echo "::error::No 'Developer ID Application' identity in MAC_DEVID_P12_B64"; exit 1; }
            SIGN=(codesign --force --sign "$ID" --keychain "$KC" --timestamp --options runtime)
            echo "SIGNED_WITH=devid" >> "$GITHUB_ENV"
          elif [ -n "$CERT_P12_B64" ]; then
            import_p12 "$CERT_P12_B64" "$CERT_PASSWORD"
            ID=$(security find-certificate -c "Conduit Self-Signed" -Z "$KC" | awk '/SHA-1/{print $NF}')
            SIGN=(codesign --force --sign "$ID" --keychain "$KC" --timestamp=none --options runtime)
          else
            echo "::warning::No signing secrets; ad-hoc signing"
            SIGN=(codesign --force --sign - --timestamp=none)
          fi
          # Inside-out: nested code first, then the app.
          find "$APP/Contents/Library/SystemExtensions" -maxdepth 1 -name "*.systemextension" -exec "${SIGN[@]}" {} \; 2>/dev/null || true
          "${SIGN[@]}" --entitlements "$ENT" "$APP"
          codesign --verify --deep --strict "$APP" || echo "::warning::codesign verify reported a problem"
          codesign -dvv "$APP" 2>&1 | grep -E "Authority|TeamIdentifier|Signature" || true

      # Apple's malware check; the ticket is stapled so it works offline too.
      - name: Notarize app
        if: env.SIGNED_WITH == 'devid'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_B64: ${{ secrets.ASC_KEY_P8_B64 }}
        run: |
          APP=build/Build/Products/Release/Conduit.app
          printf '%s' "$ASC_KEY_P8_B64" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/AuthKey.p8"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --wait --timeout 30m | tee "$RUNNER_TEMP/notary.log"
          grep -q "status: Accepted" "$RUNNER_TEMP/notary.log" || { echo "::error::Notarization was not accepted"; exit 1; }
          xcrun stapler staple "$APP"
          spctl -a -vv -t exec "$APP"

      - name: Package
        run: |
          cd build/Build/Products/Release
          ditto -c -k --keepParent Conduit.app Conduit-macOS.zip
          mkdir -p dmg && cp -R Conduit.app dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname Conduit -srcfolder dmg -ov -format UDZO Conduit.dmg
      - name: Notarize DMG
        if: env.SIGNED_WITH == 'devid'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cd build/Build/Products/Release
          ID=$(security find-identity -v -p codesigning | awk -F'"' '/Developer ID Application/{print $2; exit}')
          codesign --force --sign "$ID" --timestamp Conduit.dmg
          xcrun notarytool submit Conduit.dmg --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --wait --timeout 30m | tee "$RUNNER_TEMP/notary-dmg.log"
          grep -q "status: Accepted" "$RUNNER_TEMP/notary-dmg.log" || { echo "::error::DMG notarization was not accepted"; exit 1; }
          xcrun stapler staple Conduit.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            macos/build/Build/Products/Release/Conduit-macOS.zip
            macos/build/Build/Products/Release/Conduit.dmg

  publish:
    needs: [version, android, macos]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      # version.json is what the apps read to find updates.
      - run: |
          mkdir files && cp out/Conduit.apk out/Conduit-macOS.zip out/Conduit.dmg files/
          base="https://github.com/${{ github.repository }}/releases/download/latest"
          cat > files/version.json <<JSON
          {
            "build": ${{ needs.version.outputs.build }},
            "version": "1.0.${{ needs.version.outputs.build }}",
            "notes": "${{ needs.version.outputs.notes }}",
            "android": { "url": "$base/Conduit.apk", "size": $(stat -c%s files/Conduit.apk) },
            "mac": { "url": "$base/Conduit-macOS.zip", "size": $(stat -c%s files/Conduit-macOS.zip) }
          }
          JSON
          cat files/version.json
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Conduit 1.0.${{ needs.version.outputs.build }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            ${{ needs.version.outputs.notes }}

            - **Conduit.apk**: Android. Installed copies update themselves from inside the app.
            - **Conduit.dmg**: Mac. Drag Conduit into Applications. After that, it updates itself.
          files: files/*
