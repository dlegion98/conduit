name: Build & release
# Every branch is built and tested; only main publishes a release (which the apps auto-update to).
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: "build-${{ github.ref }}", cancel-in-progress: false }

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.v.outputs.build }}
      notes: ${{ steps.v.outputs.notes }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # One increasing build number for both apps: the commit count.
      - id: v
        run: |
          echo "build=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
          echo "notes=$(git log -1 --pretty=%s | tr -d '"')" >> "$GITHUB_OUTPUT"

  android:
    needs: version
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android } }
    env:
      BUILD_NUMBER: ${{ needs.version.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      # Same key every build, so updates install over the previous version.
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            # Tolerate spaces/line breaks picked up while pasting the secret.
            printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/conduit.jks" || { echo "::error::ANDROID_KEYSTORE_B64 isn't valid base64 - re-paste it"; exit 1; }
            sum=$(sha256sum "$RUNNER_TEMP/conduit.jks" | cut -d' ' -f1)
            [ "$sum" = "1225994de27ec60b70bb2be02a38598a7eec32e91d12870e839cd08bcfe31010" ] || { echo "::error::ANDROID_KEYSTORE_B64 doesn't match the generated keystore (got ${#KEYSTORE_B64} chars) - re-paste it"; exit 1; }
            echo "CONDUIT_KEYSTORE=$RUNNER_TEMP/conduit.jks" >> "$GITHUB_ENV"
            echo "CONDUIT_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_B64 secret not set; signing with a throwaway debug key (in-app updates will fail)"
          fi
      - run: chmod +x gradlew && ./gradlew assembleRelease --stacktrace
      - run: cp app/build/outputs/apk/release/app-release.apk Conduit.apk
      - uses: actions/upload-artifact@v4
        with: { name: android, path: android/Conduit.apk }

  macos:
    needs: version
    runs-on: macos-15
    defaults: { run: { working-directory: macos } }
    env:
      BUILD_NUMBER: ${{ needs.version.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen && xcodegen
      - run: |
          xcodebuild -project Conduit.xcodeproj -scheme Conduit -configuration Release \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION=1.0.$BUILD_NUMBER CURRENT_PROJECT_VERSION=$BUILD_NUMBER build | xcpretty || exit ${PIPESTATUS[0]}
      # A stable self-signed identity keeps macOS permissions (Accessibility etc.) across updates.
      - name: Sign
        env:
          CERT_P12_B64: ${{ secrets.MAC_CERT_P12_B64 }}
          CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          APP=build/Build/Products/Release/Conduit.app
          ENT=Conduit/Resources/Conduit-adhoc.entitlements
          if [ -n "$CERT_P12_B64" ]; then
            KC="$RUNNER_TEMP/sign.keychain-db"
            security create-keychain -p ci "$KC"
            security set-keychain-settings "$KC"
            security unlock-keychain -p ci "$KC"
            printf '%s' "$CERT_P12_B64" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/cert.p12" || { echo "::error::MAC_CERT_P12_B64 isn't valid base64 - re-paste it"; exit 1; }
            sum=$(shasum -a 256 "$RUNNER_TEMP/cert.p12" | cut -d' ' -f1)
            [ "$sum" = "6bf025c67b3b093a61cf8d7e8e50828c5641b50fd5cec1efa5d113b2b64bd4e8" ] || { echo "::error::MAC_CERT_P12_B64 doesn't match the generated certificate (got ${#CERT_P12_B64} chars) - re-paste it"; exit 1; }
            security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$CERT_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KC" >/dev/null
            security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
            ID=$(security find-certificate -c "Conduit Self-Signed" -Z "$KC" | awk '/SHA-1/{print $NF}')
            SIGN=(codesign --force --sign "$ID" --keychain "$KC" --timestamp=none)
          else
            echo "::warning::MAC_CERT_P12_B64 secret not set; ad-hoc signing (macOS will forget permissions after each update)"
            SIGN=(codesign --force --sign - --timestamp=none)
          fi
          find "$APP/Contents/Library/SystemExtensions" -name "*.systemextension" -maxdepth 1 -exec "${SIGN[@]}" {} \; 2>/dev/null || true
          "${SIGN[@]}" --options runtime --entitlements "$ENT" "$APP"
          codesign -dvv "$APP" 2>&1 | grep -E "Authority|Identifier|Signature" || true
      - name: Package
        run: |
          cd build/Build/Products/Release
          ditto -c -k --keepParent Conduit.app Conduit-macOS.zip
          mkdir -p dmg && cp -R Conduit.app dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname Conduit -srcfolder dmg -ov -format UDZO Conduit.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            macos/build/Build/Products/Release/Conduit-macOS.zip
            macos/build/Build/Products/Release/Conduit.dmg

  publish:
    needs: [version, android, macos]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      # version.json is what the apps read to find updates.
      - run: |
          mkdir files && cp out/Conduit.apk out/Conduit-macOS.zip out/Conduit.dmg files/
          base="https://github.com/${{ github.repository }}/releases/download/latest"
          cat > files/version.json <<JSON
          {
            "build": ${{ needs.version.outputs.build }},
            "version": "1.0.${{ needs.version.outputs.build }}",
            "notes": "${{ needs.version.outputs.notes }}",
            "android": { "url": "$base/Conduit.apk", "size": $(stat -c%s files/Conduit.apk) },
            "mac": { "url": "$base/Conduit-macOS.zip", "size": $(stat -c%s files/Conduit-macOS.zip) }
          }
          JSON
          cat files/version.json
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Conduit 1.0.${{ needs.version.outputs.build }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            ${{ needs.version.outputs.notes }}

            - **Conduit.apk**: Android. Installed copies update themselves from inside the app.
            - **Conduit.dmg**: Mac. Drag Conduit into Applications. After that, it updates itself.
          files: files/*
