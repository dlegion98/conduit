name: macOS app
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-15
    defaults: { run: { working-directory: macos } }
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen && xcodegen
      # Ad-hoc signed build (no Apple team needed). The webcam extension needs a real team
      # signature to install, so this build uses entitlements without it; all other features work.
      - run: |
          xcodebuild -project Conduit.xcodeproj -scheme Conduit -configuration Release \
            -derivedDataPath build CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            CODE_SIGN_ENTITLEMENTS=Conduit/Resources/Conduit-adhoc.entitlements \
            OTHER_CODE_SIGN_FLAGS=--deep build | xcpretty || exit ${PIPESTATUS[0]}
      - run: cd build/Build/Products/Release && ditto -c -k --keepParent Conduit.app Conduit-macOS.zip
      - name: Make DMG (drag Conduit to Applications)
        run: |
          mkdir -p dmg && cp -R build/Build/Products/Release/Conduit.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Conduit" -srcfolder dmg -ov -format UDZO build/Build/Products/Release/Conduit.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: Conduit-macOS
          path: |
            macos/build/Build/Products/Release/Conduit-macOS.zip
            macos/build/Build/Products/Release/Conduit.dmg
