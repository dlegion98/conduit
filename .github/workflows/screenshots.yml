name: Android screenshots
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew testDebugUnitTest --tests '*ScreenshotTest*' --stacktrace
      - if: always()
        run: ls -la app/build/screenshots || true
      # main → "screenshots"; branches → "screenshots-<branch>" so UI can be reviewed before merging.
      - if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref == 'refs/heads/main' && 'screenshots' || format('screenshots-{0}', github.ref_name) }}
          target_commitish: ${{ github.sha }}
          name: UI screenshots (${{ github.ref_name }})
          prerelease: true
          make_latest: false
          files: android/app/build/screenshots/*.png
          fail_on_unmatched_files: false
