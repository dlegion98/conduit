<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1D2A44"/><stop offset="1" stop-color="#0A0E15"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#3D7BFF" stop-opacity="0.22"/><stop offset="1" stop-color="#3D7BFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-opacity="0.35"/></filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#sh)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>
  <rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>
  <g transform="translate(512 512) scale(0.74) translate(-512 -512)">
  <defs>
    <linearGradient id="gA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8AB6FF"/><stop offset="1" stop-color="#3D7BFF"/>
    </linearGradient>
    <linearGradient id="gB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#62EDB6"/><stop offset="1" stop-color="#1FB36B"/>
    </linearGradient>
    <!-- Where blue crosses over green: the green ring's own shape, limited to the top crossing. -->
    <mask id="over" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="black"/>
      <g clip-path="url(#topHalf)">
        <rect x="432" y="362" width="440" height="300" rx="150" fill="none" stroke="white" stroke-width="96"/>
      </g>
    </mask>
    <mask id="under" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="black"/>
      <g clip-path="url(#bottomHalf)">
        <rect x="152" y="362" width="440" height="300" rx="150" fill="none" stroke="white" stroke-width="96"/>
      </g>
    </mask>
    <clipPath id="bottomHalf"><rect x="380" y="512" width="240" height="312"/></clipPath>
    <clipPath id="topHalf"><rect x="380" y="200" width="240" height="312"/></clipPath>
  </defs>
  <g transform="rotate(-38 512 512)">
    <rect x="152" y="362" width="440" height="300" rx="150" fill="none" stroke="url(#gA)" stroke-width="96"/>
    <!-- a hairline gap in the background colour gives the overlap depth -->
    <rect x="432" y="362" width="440" height="300" rx="150" fill="none" stroke="#141C2D" stroke-width="128" mask="url(#under)"/>
    <rect x="432" y="362" width="440" height="300" rx="150" fill="none" stroke="url(#gB)" stroke-width="96"/>
    <g mask="url(#over)">
      <rect x="152" y="362" width="440" height="300" rx="150" fill="none" stroke="#141C2D" stroke-width="128"/>
      <rect x="152" y="362" width="440" height="300" rx="150" fill="none" stroke="url(#gA)" stroke-width="96"/>
    </g>
  </g>

  </g>
</svg>